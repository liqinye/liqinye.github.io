<dialog id="lb" class="lb" aria-label="Photo viewer" aria-describedby="lb-cap">
  <button class="lb-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <figure>
    <picture><source id="lb-webp" type="image/webp"><img id="lb-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></picture>
    <figcaption id="lb-cap" aria-live="polite"></figcaption>
  </figure>
  <button class="lb-next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('lb'), img = document.getElementById('lb-img'), webp = document.getElementById('lb-webp'), cap = document.getElementById('lb-cap');
  if (!dlg || !dlg.showModal) return;
  var items = [], i = 0, x0 = null;
  function show(n) {
    i = (n + items.length) % items.length;
    var a = items[i], thumb = a.querySelector('img');
    var r = thumb ? (thumb.getAttribute('width') / thumb.getAttribute('height')) : 1.5;
    var sizes = 'min(100vw, calc((100vh - 7.5rem) * ' + r.toFixed(4) + '))';
    webp.srcset = a.dataset.webp || ''; webp.sizes = sizes;
    img.srcset = a.dataset.srcset || ''; img.sizes = sizes; img.src = a.href;
    img.alt = thumb ? thumb.alt : ''; cap.textContent = a.dataset.caption || '';
  }
  document.querySelectorAll('.photoset__row').forEach(function (row) {
    row.addEventListener('click', function (e) {
      var a = e.target.closest('a.frame'); if (!a) return;
      e.preventDefault(); items = Array.prototype.slice.call(row.querySelectorAll('a.frame'));
      show(items.indexOf(a)); dlg.showModal();
    });
  });
  dlg.addEventListener('click', function (e) {
    if (e.target === dlg || e.target.closest('.lb-close')) { dlg.close(); return; }
    if (e.target.closest('.lb-prev')) show(i - 1);
    if (e.target.closest('.lb-next')) show(i + 1);
  });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
  dlg.addEventListener('close', function () { img.removeAttribute('srcset'); img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; webp.srcset = ''; });
  dlg.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', function (e) {
    if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null;
  });
})();
</script>
