<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title and page.url != "/" -%}
  <title>{{ page.title }} · {{ site.title }}</title>
  {%- else -%}
  <title>{{ site.title }}</title>
  {%- endif %}
  <meta name="theme-color" content="#FAF8F2">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}var d=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name=theme-color]').content=d?'#161513':'#FAF8F2';}catch(e){}})();</script>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/lusitana-latin-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
  {%- endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ '/assets/img/favicon-16.png' | relative_url }}" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  {% seo title=false %}
</head>
