    - { name: Sudheer Chava }
    - { name: Chao Zhang }
  venue: arXiv
  year: 2026
  date: 2026-09-24
  status: under-review
  summary: >-
    1,568 resolved Polymarket events replayed as sequences of dated forecasting steps over 18.8 million
    dated news articles, so agents can be evaluated, studied over time, and trained reproducibly.
    Across 12 models, research tools help, yet every model still trails the market.
