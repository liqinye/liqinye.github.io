# Publications. `featured: true` entries appear as project cards (first-author work).
# Author flags: self (highlight), equal (equal contribution, rendered with *).
# `date` only orders the lists (newest first on /publications/ and among the featured cards); it is not displayed, so it may be nudged to place an entry (see EPSBench).
# venue is the short name without year; track is optional (e.g. Research Track).
# `status`: published (venue line "KDD 2025 · Research Track") | preprint | under-review (both render as "Preprint · year"). `image` (3:2 jpg) is relative to /assets/img/projects/; `motif` (an inline SVG in _includes/motifs/) is the fallback when `image` is absent.
# `media` (an animated GIF in the same folder) replaces `image` on the card, letterboxed in the 3:2 frame; `poster` is the still shown to visitors who prefer reduced motion.

- key: alphabet
  featured: true
  title: "AlphaBet: Reinforcement Learning for LLM Event Forecasting Agents"
  short: AlphaBet
  authors:
    - { name: Liqin Ye, self: true }
    - { name: Rongzhi Zhang }
    - { name: Xin Liu }
    - { name: Zheng Li }
    - { name: Yuan He }
    - { name: Qingyu Yin }
    - { name: Priyanka Nigam }
    - { name: Chao Zhang }
  venue: arXiv
  year: 2026
  date: 2026-10-15
  status: under-review
  summary: >-
    One LLM policy learns to search, reason, and report calibrated probabilities at several dates
    before an event resolves, so a single outcome supervises decisions under many information states.
    Cuts Brier score from 0.731 to 0.626 on Forecast-Dojo.
  image: alphabet.jpg
  motif: alphabet.svg
  links:
    arxiv: "https://arxiv.org/abs/2610.22684"
    code: "https://github.com/AlphaBet-Agent/AlphaBet"
    website: "https://alphabet-agent.github.io/"
    data: "https://huggingface.co/collections/liqinye/alphabet"

- key: forecast-dojo
