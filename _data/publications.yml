- key: evotd
  featured: true
  title: "Evolutionary Task Discovery: Advancing Reasoning Frontiers via Skill Composition and Complexity Scaling"
  short: EvoTD
  authors:
    - { name: Liqin Ye, self: true }
    - { name: Yanbin Yin }
    - { name: Michael Galarnyk }
    - { name: Yuzhao Heng }
    - { name: Sudheer Chava }
    - { name: Chao Zhang }
  venue: arXiv
  year: 2026
  date: 2026-05-12
  status: under-review
  summary: >-
    Treats reasoning-data synthesis as a directed search over algorithmic skills and complexity attributes.
    Crossover composes skills, parametric mutation scales structure, and a zone-of-proximal-development
    filter keeps tasks learnable, giving consistent gains across model families and scales.
  image: evotd.jpg
  motif: evotd.svg
  links:
    arxiv: "https://arxiv.org/abs/2605.11666"
    code: "https://github.com/liqinye/EvoTD"

- key: pre-control
  featured: true
  title: "Precise Attribute Intensity Control in Large Language Models via Targeted Representation Editing"
  short: PRE-CONTROL
  authors:
    - { name: Rongzhi Zhang, equal: true }
    - { name: Liqin Ye, self: true, equal: true }
    - { name: Yuzhao Heng }
    - { name: Xiang Chen }
    - { name: Tong Yu }
    - { name: Lingkai Kong }
    - { name: Sudheer Chava }
    - { name: Chao Zhang }
  venue: arXiv
  year: 2025
  date: 2025-10-14
  status: preprint
  summary: >-
    Reframes alignment as target reaching rather than maximization: a lightweight value function trained
    with temporal-difference learning predicts final attribute scores from partial generations, and
    gradient edits on hidden states steer outputs to exact user-specified intensities.
  image: pre-control.jpg
  motif: pre-control.svg
  links:
    arxiv: "https://arxiv.org/abs/2510.12121"
    code: "https://github.com/Pre-Control/pre-control"

- key: sidyp
  featured: true
  title: "Calibrating Pre-trained Language Classifiers on <span class=\"nowrap\">LLM-generated</span> Noisy Labels via Iterative Refinement"
  short: SiDyP
  authors:
    - { name: Liqin Ye, self: true }
    - { name: Agam Shah }
    - { name: Chao Zhang }
    - { name: Sudheer Chava }
  venue: KDD
  venue_long: ACM SIGKDD Conference on Knowledge Discovery and Data Mining
  track: Research Track
  year: 2025
  date: 2025-05-26
  status: published
  summary: >-
    Simplex label diffusion with a dynamic prior retrieves plausible true-label candidates in embedding
    space and iteratively denoises LLM-generated labels, lifting fine-tuned BERT classifiers by 7.2–7.3%
    on average on zero- and few-shot auto-labeled NLP tasks.
  image: sidyp.jpg
  motif: sidyp.svg
  links:
    arxiv: "https://arxiv.org/abs/2505.19675"
    code: "https://github.com/gtfintechlab/SiDyP"

